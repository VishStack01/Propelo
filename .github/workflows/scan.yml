name: scan

# Hourly: find company job boards, read every board plus the remote job boards
# with public feeds, publish the result as assets of the `feed-latest`
# release (india.jsonl.gz and friends), and rebuild the public job board on GitHub Pages.
# The feed and the board are public lists of openings, not anyone's personal
# data; personal filters run elsewhere (`careeros filter-feed`).
#
# GitHub delays or drops scheduled runs when it is busy, so the schedule asks
# every hour at an off-peak minute; caches keep the polite polling limits.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      rediscover:
        description: "Re-check every company's job board from scratch"
        type: boolean
        default: false
      chain:
        description: "Started by the previous scan (keeps scans back to back; not for manual runs)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_again.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Note the start time
        run: echo "SCAN_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Restore the last feed (board map and caches)
        # From the `feed-latest` release; the old `feed` branch is the fallback.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release download feed-latest -p feed-state.tar.gz -D "$RUNNER_TEMP" 2>/dev/null; then
            tar -xzf "$RUNNER_TEMP/feed-state.tar.gz"
          elif git fetch --depth 1 origin feed 2>/dev/null; then
            git archive FETCH_HEAD feed | tar -x
          fi
          mkdir -p feed
          # Lists of employers that have sponsored in the US, Canada and Ireland, refreshed weekly by registers.yml.
          gh release download feed-latest -p us-sponsors.csv -p ca-sponsors.csv -p ie-sponsors.csv -D feed --clobber 2>/dev/null || true
          if [ "${{ inputs.rediscover }}" = "true" ]; then rm -f feed/boards.json; fi

      - name: Hiring radar (every third run)
        # JobSpy reads Indeed India and Naukri to learn which companies are hiring.
        # Only employer board links and company names are kept; see careeros/sources/radar.py.
        continue-on-error: true
        run: |
          if [ $(( 10#$(date -u +%H) % 3 )) -eq 0 ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.chain }}" != "true" ]; }; then
            pip install "python-jobspy>=1.4" >/dev/null 2>&1 || true
            careeros radar --config config/radar.toml --boards feed/boards.json --out feed/radar-companies.csv 2>&1 | tee feed/radar.log
          fi

      - name: Early-career pay from real offers
        # leetcode-compensation (MIT): median offers at up to 1.5 years, per company, so roles
        # that don't state pay can be judged on what that company really pays freshers.
        continue-on-error: true
        run: careeros payers --out config/pay/offers-pay.csv

      - name: Deep sweep list (daily)
        # ~20,000 company boards from the open ats-scrapers inventory (MIT). Only the list is
        # refreshed here; discover checks them a few hundred at a time and keeps the boards
        # that list developer roles in India or open to it.
        continue-on-error: true
        run: |
          if [ ! -f feed/deep-companies.csv ] || [ $(( 10#$(date -u +%H) )) -eq 4 ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.chain }}" != "true" ]; }; then
            careeros deep --boards feed/boards.json --out feed/deep-companies.csv 2>&1 | tee feed/deep.log
            careeros yc-companies --out feed/yc-companies.csv 2>&1 | tee -a feed/deep.log
          fi

      - name: UK sponsor register (daily)
        # The Home Office's public list of employers licensed to sponsor Skilled Worker visas, so UK
        # roles can say whether the employer can sponsor at all. Kept with the feed between runs.
        continue-on-error: true
        run: |
          if [ ! -f feed/uk-sponsors.csv ] || [ $(( 10#$(date -u +%H) )) -eq 5 ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.chain }}" != "true" ]; }; then
            careeros uk-sponsors --out feed/uk-sponsors.csv
          fi

      - name: Dutch sponsor register (daily)
        # The Dutch immigration service's public list of employers recognised as sponsors for work (the highly
        # skilled migrant route needs one), so roles in the Netherlands can say whether the employer is on it.
        continue-on-error: true
        run: |
          if [ ! -f feed/nl-sponsors.csv ] || [ $(( 10#$(date -u +%H) )) -eq 6 ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.chain }}" != "true" ]; }; then
            careeros nl-sponsors --out feed/nl-sponsors.csv
          fi

      - name: Sponsor sweep list
        # Employers on the government sponsor lists (UK, Netherlands, Ireland, US, Canada) whose job boards
        # nobody has listed yet. Only names are prepared here, from the files above; discover tries 500 of
        # them a run (CAREEROS_SPONSOR_SWEEP) and keeps a board only when it is that employer's and has
        # roles in that country.
        continue-on-error: true
        run: careeros sponsor-candidates --feed feed --boards feed/boards.json --out feed/sponsor-companies.csv 2>&1 | tee feed/sponsor-sweep.log

      - name: Discover job boards
        # New companies, boards that errored last scan, and unmapped companies
        # every 14 days (swept boards every 21). At most 3,000 per run and 12 minutes:
        # a quarter from the curated and radar lists, the rest from the deep sweep (one
        # request per board), so a full pass of the sweep takes a day or two. Boards with roles in India or a
        # developed country are kept (discover.FOCUS), not only India.
        env:
          CAREEROS_SCAN_ONSITE: world
        run: |
          set -o pipefail
          careeros discover --companies config/companies/companies.csv --extra feed/radar-companies.csv --extra feed/yc-companies.csv --extra feed/deep-companies.csv --extra feed/sponsor-companies.csv --cache feed/boards.json --refresh-days 14 --limit 3000 --max-minutes 12 2>&1 | tee feed/discover.log

      - name: Scan boards
        # On-site and hybrid roles in every country, for people searching outside India.
        env:
          CAREEROS_SCAN_ONSITE: world
          # A few boards sometimes hang for an hour; stop waiting after 60 minutes and keep their last roles.
          CAREEROS_SCAN_DEADLINE_MIN: "50"
          # As the board list grows, each run reads the curated boards plus the most overdue of the rest
          # (deep-sweep boards every four hours); boards not read keep their roles from the last run.
          CAREEROS_SCAN_MAX_BOARDS: "2400"
          # Country-wide job APIs (see careeros/sources/national.py). Each stays off until its secret is added.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: |
          set -o pipefail
          careeros scan --boards feed/boards.json --out feed 2>&1 | tee feed/scan.log

      - name: Newly funded companies, for you to review
        # Funding headlines from Inc42, Entrackr and TechCrunch India. Nothing is
        # added to the company list until you run `careeros funded --add`.
        continue-on-error: true
        run: careeros funded --json --days 30 > feed/funded.json

      - name: Package the filter tool next to the feed
        # One-file copy of careeros (python3 careeros.pyz ...) for agents that
        # can download files but can't clone repositories.
        if: always()
        run: |
          app="$RUNNER_TEMP/app"
          mkdir -p "$app" feed
          cp -r careeros "$app/"
          find "$app" -name __pycache__ -prune -exec rm -rf {} +
          printf 'from careeros.cli import main\nmain()\n' > "$app/__main__.py"
          python -m zipapp "$app" -o feed/careeros.pyz
          cp config/platforms.toml feed/platforms.toml
          python feed/careeros.pyz --version

      - name: Publish the feed (release assets)
        # Also after a failed step, so the board map and the logs are kept. The feed lives
        # on the `feed-latest` pre-release: replacing assets keeps no history, so the
        # repository does not grow every hour and no branch is ever force-pushed.
        # Public URL: https://github.com/<owner>/<repo>/releases/download/feed-latest/<file>
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf "$RUNNER_TEMP/feed-state.tar.gz" feed
          if ! gh release view feed-latest >/dev/null 2>&1; then
            gh release create feed-latest --prerelease --title "Job feed (latest)" \
              --notes "Open roles from company career pages, replaced by every scan. See docs/feed.md."
          fi
          # The US, Canadian and Irish lists belong to registers.yml: never overwrite a newer copy with this run's older one.
          files=$(find feed -maxdepth 1 -type f ! -name summary.json ! -name us-sponsors.csv ! -name ca-sponsors.csv ! -name ie-sponsors.csv ! -name sponsor-companies.csv)
          gh release upload feed-latest $files "$RUNNER_TEMP/feed-state.tar.gz" --clobber
          # summary.json last: readers treat a new generatedAt as "the rest is ready".
          [ -f feed/summary.json ] && gh release upload feed-latest feed/summary.json --clobber
          python -c "import json; s=json.load(open('feed/summary.json')); print(f\"{s['openings']} openings from {s['boards']} company boards; remote boards: {s.get('remoteBoards')}\")" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Warn when the feed is stale
        # The feed should be at most 3 hours old after a publish; anything older means
        # the scan or the publish is failing, and the dashboard's "fresh roles" promise is off.
        if: always()
        run: |
          python - <<'PY'
          import json, sys, datetime as dt
          try:
              s = json.load(open("feed/summary.json"))
              t = dt.datetime.fromisoformat(s["generatedAt"].replace("Z", "+00:00"))
          except Exception as e:
              print(f"::error::No readable feed/summary.json ({e})"); sys.exit(1)
          age = (dt.datetime.now(dt.timezone.utc) - t).total_seconds() / 3600
          if age > 3:
              print(f"::error::The feed is {age:.1f} hours old"); sys.exit(1)
          print(f"Feed age: {age:.1f} hours")
          PY

      - name: Restore company logos
        if: always()
        uses: actions/cache@v4
        with:
          path: .logo-cache
          key: logos-${{ github.run_id }}
          restore-keys: logos-

      - name: Fetch company logos (new or stale only)
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: careeros logos --feed feed --cache .logo-cache --limit 1500

      - name: Build the job board
        if: always()
        run: |
          # The site's address: the repository variable SITE_URL (https://propelo.org/ once the custom domain is set
          # in Settings > Pages), else the default GitHub Pages address.
          base="${{ vars.SITE_URL }}"
          [ -n "$base" ] || base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          careeros site --feed feed --out site --demo dashboard/index.html --base-url "$base" --logos .logo-cache

      - uses: actions/configure-pages@v5
        if: always()

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

      # GitHub sometimes can't see the artifact for a few seconds after the upload, so wait, and try once more.
      - if: always()
        run: sleep 15

      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: always() && steps.deploy.outcome == 'failure'
        run: sleep 45

      - id: deploy_again
        if: always() && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Start the next scan
        # GitHub runs scheduled workflows late or not at all on quiet repositories (this one was getting about
        # four scans a day from an hourly schedule). Each finished scan starts the next one instead, so roles
        # are re-read about once an hour. Only one scan runs at a time (see `concurrency`); a run that ended
        # in under 20 minutes failed early and doesn't start another, so a broken scan can't loop.
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ $(( $(date +%s) - ${SCAN_T0:-0} )) -ge 1200 ]; then
            gh workflow run scan.yml --ref main -f chain=true
          else
            echo "Short run: leaving the next scan to the schedule."
          fi
