name: pages

# Rebuild the website, docs, job board and dashboard demo on GitHub Pages
# whenever they change on main. The hourly scan (scan.yml) publishes the same
# site after each scan; this workflow covers changes made between scans and
# reuses the last published feed, so it never scrapes anything itself.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "dashboard/**"
      - "careeros/site.py"
      - "careeros/site_app.html"
      - "careeros/tags.py"
      - "careeros/logos.py"
      - "careeros/growth_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_again.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Fetch the last published feed
        # The feed and the sponsor lists live on the `feed-latest` release (see scan.yml and registers.yml).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p feed
          gh release download feed-latest -D feed --clobber -p india.jsonl.gz -p full.jsonl.gz -p summary.json \
            -p uk-sponsors.csv -p nl-sponsors.csv -p us-sponsors.csv -p ca-sponsors.csv -p ie-sponsors.csv || true
          ls -la feed

      - name: Restore company logos
        uses: actions/cache@v4
        with:
          path: .logo-cache
          key: logos-${{ github.run_id }}
          restore-keys: logos-

      - name: Fetch company logos (new or stale only)
        continue-on-error: true
        timeout-minutes: 12
        run: careeros logos --feed feed --cache .logo-cache --limit 1500

      - name: Build the site
        run: |
          base="${{ vars.SITE_URL }}"
          [ -n "$base" ] || base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          careeros site --feed feed --out site --demo dashboard/index.html --website website --base-url "$base" --logos .logo-cache
          ls site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub sometimes can't see the artifact for a few seconds after the upload ("No artifacts named github-pages"),
      # so wait a moment, and try once more if the first deployment fails.
      - run: sleep 15

      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - id: deploy_again
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
