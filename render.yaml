# One-click deploy on Render: a PostgreSQL database, the web app and the worker.
# After the first deploy, set PUBLIC_URL (https://app.propelo.org once the custom domain is added),
# SMTP_URL, MAIL_FROM, SUPPORT_EMAIL and BOOTSTRAP_ADMIN_EMAIL in the dashboard, then redeploy.
# Optional: PROPELO_LLM + a provider key for the hosted AI allowance, the RAZORPAY_* values to take
# rupee payments and the DODO_* values to take dollar payments. The full walk-through is docs/launch.md.
# Check plan names and prices on render.com before you deploy.
databases:
  - name: propelo-db
    databaseName: propelo
    user: propelo

services:
  - type: web
    name: propelo-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    preDeployCommand: propelo cloud migrate
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: propelo-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_URL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: SIGNUP_MODE
        value: open
      - key: SUPPORT_EMAIL
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: SECRETS_KEY
        generateValue: true
      - key: PRO_PRICE_INR
        value: "499"
      - key: ULTRA_PRICE_INR
        value: "1199"
      - key: FREE_AI_CREDITS
        value: "15"
      - key: PRO_AI_CREDITS
        value: "400"
      - key: ULTRA_AI_CREDITS
        value: "1500"
      - key: PROPELO_LLM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_PRO
        sync: false
      - key: RAZORPAY_PLAN_ULTRA
        sync: false
      - key: DODO_API_KEY
        sync: false
      - key: DODO_WEBHOOK_SECRET
        sync: false
      - key: DODO_PRODUCT_PRO
        sync: false
      - key: DODO_PRODUCT_ULTRA
        sync: false
      - key: DODO_MODE
        value: test
      - key: CONCIERGE
        value: "off"
      - key: GUARANTEE
        value: "on"
      - key: DODO_PRODUCT_GUARANTEE
        sync: false
      - key: CONCIERGE_TAX_RATE
        value: "0"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PROPELO_LLM_FALLBACK
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: propelo-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: propelo cloud worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: propelo-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_URL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: SIGNUP_MODE
        value: open
      - key: SECRETS_KEY
        fromService:
          type: web
          name: propelo-web
          envVarKey: SECRETS_KEY
      # The worker sends automatic recruiter emails, so it needs the Google client too.
      - key: GOOGLE_CLIENT_ID
        fromService:
          type: web
          name: propelo-web
          envVarKey: GOOGLE_CLIENT_ID
      - key: GOOGLE_CLIENT_SECRET
        fromService:
          type: web
          name: propelo-web
          envVarKey: GOOGLE_CLIENT_SECRET
      - key: SENTRY_DSN
        fromService:
          type: web
          name: propelo-web
          envVarKey: SENTRY_DSN
      # The worker moves guarantees on (interview found, window ended, claim due) and emails people.
      - key: GUARANTEE
        fromService:
          type: web
          name: propelo-web
          envVarKey: GUARANTEE
      - key: CONCIERGE
        fromService:
          type: web
          name: propelo-web
          envVarKey: CONCIERGE
      # The worker cancels a replaced subscription after a plan change, so it needs the payment keys too.
      - key: RAZORPAY_KEY_ID
        fromService:
          type: web
          name: propelo-web
          envVarKey: RAZORPAY_KEY_ID
      - key: RAZORPAY_KEY_SECRET
        fromService:
          type: web
          name: propelo-web
          envVarKey: RAZORPAY_KEY_SECRET
      - key: RAZORPAY_PLAN_PRO
        fromService:
          type: web
          name: propelo-web
          envVarKey: RAZORPAY_PLAN_PRO
      - key: RAZORPAY_PLAN_ULTRA
        fromService:
          type: web
          name: propelo-web
          envVarKey: RAZORPAY_PLAN_ULTRA
      - key: DODO_API_KEY
        fromService:
          type: web
          name: propelo-web
          envVarKey: DODO_API_KEY
      - key: DODO_PRODUCT_PRO
        fromService:
          type: web
          name: propelo-web
          envVarKey: DODO_PRODUCT_PRO
      - key: DODO_PRODUCT_ULTRA
        fromService:
          type: web
          name: propelo-web
          envVarKey: DODO_PRODUCT_ULTRA
      - key: DODO_MODE
        fromService:
          type: web
          name: propelo-web
          envVarKey: DODO_MODE
      - key: SUPPORT_EMAIL
        sync: false
