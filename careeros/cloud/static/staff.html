<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Propelo · Concierge workspace</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--page:#F7F2E9;--card:#FFFCF7;--panel:#F2EADC;--ink:#151515;--ink-2:#4F4A44;--muted:#6E675D;--line:rgba(21,21,21,.09);--pink:#FF85BA;--lav:#BDB6FC;--yellow:#FCF15C;--orange:#FF7034;--bad:#B42D6A;
  --f:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--ease:cubic-bezier(.16,1,.3,1)}
@media (prefers-color-scheme:dark){:root{--page:#141311;--card:#1C1A17;--panel:#26231F;--ink:#F3ECE0;--ink-2:#D2CABE;--muted:#9E978B;--line:rgba(243,236,224,.09);--bad:#FF9CC8}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
a{color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--page);z-index:2}
.logo{font-weight:600;font-size:20px;letter-spacing:-.02em;text-decoration:none}.logo .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);margin-left:2px}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100vh - 58px)}
aside{border-right:1px solid var(--line);padding:16px;display:grid;gap:10px;align-content:start}
main{padding:20px 24px 60px;display:grid;gap:18px;align-content:start;max-width:980px}
h1{font-size:26px;font-weight:500;letter-spacing:-.02em;margin:0}
h2{font-size:17px;font-weight:600;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13.5px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:500;background:var(--panel);color:var(--ink-2)}
.pill.ultra{background:var(--lav);color:#151515}.pill.req{background:var(--yellow);color:#151515}.pill.wait{background:var(--pink);color:#151515}
.btn{font:inherit;font-weight:500;border:0;border-radius:999px;padding:8px 16px;background:var(--ink);color:var(--page);cursor:pointer;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.98)}.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}.btn.sm{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}
textarea{resize:vertical}
label{display:grid;gap:4px;font-size:13.5px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.case{display:grid;gap:4px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
.case[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.case b{font-weight:600}
dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0}dt{color:var(--muted)}dd{margin:0}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:8px}
.note{border-radius:14px;padding:10px 12px;background:var(--panel)}.note.private{background:transparent;box-shadow:inset 0 0 0 1px dashed var(--line);border:1px dashed var(--muted)}
.note.cand{background:var(--card);border:1px solid var(--line)}
.msg{padding:10px 14px;border-radius:12px;background:var(--panel)}.msg.err{color:var(--bad)}
.empty{padding:40px 0;color:var(--muted)}
@media (max-width:820px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a class="logo" href="/app">propelo<span class="dot"></span></a><span class="muted small" id="me"></span></header>
<div class="layout">
  <aside>
    <button class="case" id="claims-btn" type="button"><span class="row"><b>Guarantee claims</b><span class="pill req" id="claims-n" hidden></span></span><span class="small muted">Interview and Job Guarantee refunds to decide</span></button>
    <div class="row"><h1 style="font-size:20px">Concierge</h1></div>
    <label>Show<select id="filter"><option value="">Open and queued</option><option value="requested">Requested</option><option value="active">Active</option><option value="paused">Paused</option><option value="offer">Offer</option><option value="placed">Placed</option><option value="closed">Closed</option></select></label>
    <div id="cases" class="list"><p class="muted small">Loading…</p></div>
  </aside>
  <main id="detail"><div class="empty">Pick a case on the left. Unassigned requests and Ultra members come first.</div></main>
</div>
<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const inr = n => '₹' + Number(n || 0).toLocaleString('en-IN');
  const when = s => s ? new Date(s).toLocaleString('en-IN', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : '';
  const safe = u => /^https:\/\//.test(u || '') ? u : '';
  let current = null, me = null;
  const LABEL = {fullName: 'Name', headline: 'Headline', location: 'Location', linkedin: 'LinkedIn', github: 'GitHub', portfolio: 'Portfolio', summary: 'Summary', skills: 'Skills'};
  async function api(path, body){
    const r = await fetch(path, body === undefined ? {credentials: 'same-origin'} : {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json', 'X-CareerOS-CSRF': '1'}, body: JSON.stringify(body)});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Something went wrong.');
    return d;
  }
  async function list(){
    const f = $('#filter').value;
    const d = await api('/api/staff/cases' + (f ? '?status=' + f : ''));
    me = d.me; $('#me').textContent = 'Signed in as ' + (me.name || 'staff');
    const rows = d.cases.filter(c => f || c.status !== 'closed' && c.status !== 'placed');
    $('#cases').innerHTML = rows.length ? rows.map(c => `<button class="case" data-id="${esc(c.id)}" aria-current="${current === c.id}">
      <span class="row"><b>${esc(c.name || c.email)}</b>${c.plan === 'ultra' ? '<span class="pill ultra">Ultra</span>' : ''}${!c.partner ? '<span class="pill req">Unassigned</span>' : ''}${c.waitingOnCandidate ? `<span class="pill wait">${c.waitingOnCandidate} waiting on them</span>` : ''}</span>
      <span class="small muted">${esc(c.roles)}</span><span class="small muted">${esc(c.status)}${c.partner ? ' · ' + esc(c.partner) : ''} · ${esc(when(c.updatedAt))}</span></button>`).join('') : '<p class="muted small">No cases here.</p>';
  }
  const money = (minor, cur) => cur === 'USD' ? '$' + (Number(minor || 0) / 100).toFixed(2) : inr(Math.round(Number(minor || 0) / 100));
  async function claims(open){
    const d = await api('/api/staff/guarantees');
    const n = d.claims.filter(c => c.status === 'claimed').length;
    $('#claims-n').hidden = !n; $('#claims-n').textContent = n + ' to decide';
    if (!open) return;
    current = null;
    document.querySelectorAll('.case').forEach(b => b.setAttribute('aria-current', String(b.id === 'claims-btn')));
    const rows = d.claims.map(c => { const p = c.progress || {}, el = (c.eligibility || {}).checks || [];
      return `<div class="item" style="display:block"><div class="row" style="justify-content:space-between"><div><b>${esc(c.name || c.email)}</b> · ${c.kind === 'interview' ? 'Interview Guarantee' : 'Job Guarantee'} · ${esc(c.plan)}<br>
        <span class="small muted">${esc(c.email)} · window ${esc(when(c.startsAt))} to ${esc(when(c.endsAt))} · claimed ${esc(when(c.claimedAt))} · ${esc(c.status)}${c.refund ? ' · refund ' + esc(money(c.refund, c.currency)) : ''}</span></div></div>
        ${c.kind === 'interview' ? `<p class="small">Applications ${esc(p.applications)} of ${esc(p.needApplications)} · weeks ${esc(p.weeks)} of ${esc(p.needWeeks)} · interviews in the pipeline ${esc(p.interviews)} · unsafe postings left out ${esc(p.unsafeSkipped || 0)}</p>` : `<p class="small">Concierge case: ${esc(p.caseStatus || '')}. Check proposals answered within 7 days, interviews attended and offers declined in the case before deciding.</p>`}
        <p class="small muted">At the start: ${el.map(x => esc(x.label) + (x.ok ? ' ✓' : ' ✗')).join(' · ')}</p>
        ${c.note ? `<p class="small">Their note: ${esc(c.note)}</p>` : ''}
        ${c.status === 'claimed' ? `<form class="row" data-claim="${esc(c.id)}" style="flex-wrap:wrap;gap:8px;margin-top:8px"><input name="note" placeholder="Note to them (needed to reject)" style="flex:1;min-width:220px"><input name="amount" type="number" min="1" placeholder="Refund in ${c.currency === 'USD' ? 'cents' : 'paise'} (optional)" style="width:230px"><button class="btn" name="d" value="approve">Approve</button><button class="btn ghost" name="d" value="reject">Reject</button></form>`
          : c.status === 'approved' ? `<form class="row" data-claim="${esc(c.id)}" style="margin-top:8px;gap:8px"><input name="note" placeholder="Refund reference" style="flex:1"><button class="btn" name="d" value="refunded">Refund issued in Razorpay or Dodo</button></form>` : ''}</div>`; }).join('');
    $('#detail').innerHTML = `<h1>Guarantee claims</h1><p class="msg" id="say" hidden></p>
      <p class="small muted">Before approving, look at their pipeline and inbox for an interview, invitation or offer in the window. Issue the refund in the payment provider's dashboard to the original payment method, then mark it here. Every decision is logged.</p>
      <div class="list">${rows || '<p class="muted small">No claims waiting.</p>'}</div>`;
  }
  function say(t, err){ const m = $('#say'); if (m){ m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); m.hidden = !t; } }
  async function open(id){
    current = id;
    document.querySelectorAll('.case').forEach(b => b.setAttribute('aria-current', String(b.dataset.id === id)));
    try { show(await api('/api/staff/cases/' + encodeURIComponent(id))); } catch(e){ $('#detail').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  async function act(action, body){
    try { show(await api(`/api/staff/cases/${encodeURIComponent(current)}/${action}`, body || {})); list(); say('Saved.'); }
    catch(e){ say(e.message, true); }
  }
  function show(k){
    const i = k.intake || {}, p = k.profile || {}, mine = k.partnerId && me && k.partnerId === me.id;
    const subs = (k.submissions || []).map(s => `<div class="item"><div><b>${esc(s.company)}</b> · ${esc(s.title)}<br><span class="small muted">${esc(s.status)}${s.approvedAt ? ' · approved ' + esc(when(s.approvedAt)) : ''}${s.why ? ' · ' + esc(s.why) : ''}${safe(s.url) ? ` · <a href="${esc(safe(s.url))}" target="_blank" rel="noopener">posting</a>` : ''}</span></div>
      <div class="row">${s.approvedAt && ['approved', 'submitted', 'interviewing'].includes(s.status) ? `<select data-move="${esc(s.id)}"><option value="">Move to…</option>${['submitted', 'interviewing', 'offer', 'rejected', 'withdrawn'].map(x => `<option>${x}</option>`).join('')}</select>` : ''}</div></div>`).join('');
    const notes = (k.notes || []).map(n => `<div class="note ${n.shared ? (n.fromCandidate ? 'cand' : '') : 'private'}"><span class="small muted">${esc(n.author)} · ${esc(when(n.at))}${n.shared ? '' : ' · private note'}</span><br>${esc(n.body).replace(/\n/g, '<br>')}</div>`).join('');
    const places = (k.placements || []).map(pl => `<div class="card"><b>${esc(pl.company)}</b> · ${esc(pl.status)}${pl.feeable ? '' : ' · not through Concierge, no fee'}<br>
      <span class="small muted">Fixed pay ${inr(pl.fixedCtc)} · joining ${esc(pl.joiningDate)} · fee ${inr(pl.fee)}${pl.taxRate ? ' + ' + pl.taxRate + '% GST' : ''}</span>
      ${pl.status === 'reported' && pl.feeable ? `<div class="grid2" style="margin-top:10px"><label>Fixed pay from the offer letter<input type="number" data-ctc="${esc(pl.id)}" value="${esc(pl.fixedCtc)}"></label><label>Joining date<input type="date" data-join="${esc(pl.id)}" value="${esc(pl.joiningDate)}"></label></div>
        <p class="small muted">Check the offer letter with the candidate before confirming. Count only yearly fixed pay: no bonus, stock or joining bonus.</p><button class="btn sm" data-verify="${esc(pl.id)}">Confirm offer and schedule instalments</button>` : ''}
      ${(pl.instalments || []).length ? `<div class="list" style="margin-top:8px">${pl.instalments.map(x => `<span class="small">#${x.n} ${inr(x.amount / 100)} · due ${esc(x.dueOn)} · ${esc(x.status)}</span>`).join('')}</div>` : ''}
      ${['verified', 'invoicing'].includes(pl.status) ? `<p class="small muted" style="margin-top:8px">If the employer ends the job within 90 days of joining, unpaid instalments are cancelled.</p><button class="btn sm ghost" data-early="${esc(pl.id)}">The employer ended the job</button>` : ''}</div>`).join('');
    $('#detail').innerHTML = `
      <div class="row" style="justify-content:space-between"><div><h1>${esc(k.candidate.name || k.candidate.email)}</h1><span class="muted small">${esc(k.candidate.email)} · plan ${esc(k.candidate.plan)} · terms ${esc(k.termsVersion)} accepted ${esc(when(k.agreedAt))}</span></div>
        <div class="row">${!k.partnerId ? '<button class="btn" data-take>Take this case</button>' : mine ? '<span class="pill">Your case</span>' : '<span class="pill">Another partner\'s case</span>'}
        <select id="status">${['requested', 'active', 'paused', 'offer', 'placed', 'closed'].map(x => `<option${x === k.status ? ' selected' : ''}>${x}</option>`).join('')}</select></div></div>
      <p id="say" class="msg" hidden></p>
      <div class="card"><h2>What they want</h2><dl><dt>Roles</dt><dd>${esc(i.roles)}</dd><dt>Where</dt><dd>${esc(i.locations || '—')} (${esc(k.country)})</dd><dt>Current fixed</dt><dd>${inr(i.currentCtc)}</dd><dt>Expected fixed</dt><dd>${inr(i.expectedCtc)} · fee at that pay ${inr(k.feePreview.fee)}</dd><dt>Notice</dt><dd>${esc(i.noticeDays)} days</dd><dt>Phone</dt><dd>${esc(i.phone || '—')}</dd>${i.notes ? `<dt>Notes</dt><dd>${esc(i.notes)}</dd>` : ''}</dl></div>
      <div class="card"><h2>Profile</h2><dl>${Object.entries(p).filter(([, v]) => typeof v === 'string').map(([key, v]) => `<dt>${esc(LABEL[key] || key)}</dt><dd>${/^https:/.test(v) ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>` : esc(v)}</dd>`).join('') || '<dt>—</dt><dd>No profile yet</dd>'}</dl>
        ${(k.pipeline || []).length ? `<details style="margin-top:10px"><summary class="small">Their Propelo pipeline (${k.pipeline.length})</summary><div class="list" style="margin-top:8px">${k.pipeline.slice(0, 60).map(j => `<span class="small">${esc(j.company)} · ${esc(j.title)} · ${esc(j.stage)}</span>`).join('')}</div></details>` : ''}</div>
      <div class="card"><h2>Propose a role</h2><p class="small muted">The candidate approves or declines in the app. You can't apply until they approve, and only approved companies can lead to a fee.</p>
        <form id="propose" class="grid2"><label>Company<input name="company" required></label><label>Role<input name="title" required></label><label>Posting link<input name="url" type="url" placeholder="https://"></label><label>Why it fits<input name="why" placeholder="One line they'll see"></label><div><button class="btn sm" type="submit">Propose</button></div></form></div>
      <div class="card"><h2>Roles</h2><div class="list">${subs || '<span class="muted small">Nothing proposed yet.</span>'}</div></div>
      <div class="card"><h2>Messages and notes</h2><div class="list">${notes || '<span class="muted small">No messages yet.</span>'}</div>
        <form id="note" style="display:grid;gap:8px;margin-top:10px"><textarea name="body" rows="3" placeholder="Write to the candidate, or a private note"></textarea><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="private" style="width:auto"> Private note (the candidate won't see it)</label><div><button class="btn sm" type="submit">Save</button></div></form></div>
      ${places ? `<div><h2>Offers and fees</h2><div class="list">${places}</div></div>` : ''}
      <p class="small muted">Rules: never sign in as the candidate on any site, never automate LinkedIn, never send anything they haven't approved, and write only what's true about them. Every time you open a case it is logged.</p>`;
  }
  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.id === 'claims-btn') return claims(true).catch(err => say(err.message, true));
    if (t.classList.contains('case')) return open(t.dataset.id);
    if (t.hasAttribute('data-take')) return act('take');
    if (t.dataset.verify) return act('verify', {placementId: t.dataset.verify, fixedCtc: Number(document.querySelector(`[data-ctc="${t.dataset.verify}"]`).value), joiningDate: document.querySelector(`[data-join="${t.dataset.verify}"]`).value});
    if (t.dataset.early){ if (confirm('Did the employer end the job within 90 days of joining? Unpaid instalments will be cancelled.')) act('end-early', {placementId: t.dataset.early, byEmployer: true}); }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'filter') return list();
    if (e.target.id === 'status') return act('status', {status: e.target.value});
    if (e.target.dataset.move && e.target.value) return act('move', {submissionId: e.target.dataset.move, status: e.target.value});
  });
  document.addEventListener('submit', e => {
    e.preventDefault(); const f = e.target;
    if (f.dataset.claim){ const d = (e.submitter || {}).value; if (!d) return;
      return api(`/api/staff/guarantees/${encodeURIComponent(f.dataset.claim)}/${d}`, {note: f.note.value, amount: f.amount ? f.amount.value : ''}).then(() => claims(true)).then(() => say('Saved.')).catch(err => say(err.message, true)); }
    if (f.id === 'propose') return act('propose', {company: f.company.value, title: f.title.value, url: f.url.value, why: f.why.value});
    if (f.id === 'note'){ if (!f.body.value.trim()) return; return act('note', {body: f.body.value, shared: !f.private.checked}); }
  });
  list().catch(e => { $('#cases').innerHTML = `<p class="msg err">${esc(e.message)}</p>`; });
  claims(location.hash === '#guarantees').catch(() => {});
})();
</script>
</body>
</html>
