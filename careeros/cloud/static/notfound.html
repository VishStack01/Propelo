<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page not found · Propelo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<style>
:root{--page:#F7F2E9;--card:#FFFCF7;--ink:#151515;--muted:#5E574E;--line:rgba(21,21,21,.09)}
@media (prefers-color-scheme:dark){:root{--page:#141311;--card:#1C1A17;--ink:#F3ECE0;--muted:#B3AB9F;--line:rgba(243,236,224,.09)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--page);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 26px}
h1{font-size:24px;margin:0 0 8px;letter-spacing:-.02em}
p{margin:0 0 16px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--card);font-weight:600;text-decoration:none}
a.btn.ghost{background:transparent;color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>We couldn't find that page</h1>
  <p>The link may be old or mistyped. If you followed a link from an email, it may have expired: sign in and try again.</p>
  <div class="row"><a class="btn" href="/app">Open Propelo</a><a class="btn ghost" href="/business">For business</a><a class="btn ghost" href="/contact">Contact</a></div>
</main>
</body>
</html>
