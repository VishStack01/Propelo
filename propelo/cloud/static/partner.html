<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Business account</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--page:#F7F2E9;--card:#FFFCF7;--panel:#F2EADC;--ink:#151515;--ink-2:#4F4A44;--muted:#6E675D;--line:rgba(21,21,21,.09);--accent:#151515;--good:#1F6F5C;--bad:#B42D6A;
  --f:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--page:#141311;--card:#1C1A17;--panel:#26231F;--ink:#F3ECE0;--ink-2:#D2CABE;--muted:#9E978B;--line:rgba(243,236,224,.09);--accent:#F3ECE0;--good:#7FD1B9;--bad:#FF9CC8}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
a{color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--page);z-index:2}
.logo{font-weight:600;font-size:18px;letter-spacing:-.02em;text-decoration:none}
main{max-width:1080px;margin:0 auto;padding:22px 16px 80px;display:grid;gap:18px}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0}
h2{font-size:17px;font-weight:600;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13.5px}
.brand{display:flex;gap:14px;align-items:center}
.brand img{width:52px;height:52px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.brand .tile{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:20px;background:var(--accent);color:var(--card)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel);border-radius:14px;padding:12px 14px}.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:500;background:var(--panel);color:var(--ink-2)}
.pill.live{background:var(--good);color:#fff}.pill.off{background:var(--bad);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--card);font:600 14px var(--f);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:13px;white-space:nowrap}
td.n{font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:13.5px;color:var(--ink-2)}
input,select,textarea{font:15px var(--f);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:40px;width:100%}
.copy{display:flex;gap:8px;align-items:center}.copy input{flex:1;min-width:0}
.note{background:var(--panel);border-radius:12px;padding:10px 12px;font-size:14px}
.key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;background:var(--panel);padding:8px 10px;border-radius:10px}
.err{color:var(--bad);font-size:14px;min-height:18px}
.ok{color:var(--good);font-size:14px;min-height:18px}
@media (max-width:640px){h1{font-size:22px}.card{padding:16px}}
</style>
</head>
<body>
<header><a class="logo" href="/app">Business account</a><a class="small" href="/app">Back to the app</a></header>
<main id="m"><p class="muted">Loading…</p></main>
<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const when = s => s ? new Date(s).toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'}) : '';
  const COUNTRIES = [['GB', 'United Kingdom'], ['US', 'United States'], ['CA', 'Canada'], ['AU', 'Australia'], ['IE', 'Ireland'], ['DE', 'Germany'], ['NL', 'Netherlands'], ['IN', 'India'], ['AE', 'UAE'], ['SG', 'Singapore']];
  let state = {partners: [], staff: null, key: {}};
  async function api(path, method, body){
    const opt = {method: method || 'GET', credentials: 'same-origin', headers: {}};
    if (body !== undefined){ opt.headers = {'Content-Type': 'application/json', 'X-Propelo-CSRF': '1'}; opt.body = JSON.stringify(body); }
    else if (opt.method !== 'GET') opt.headers = {'X-Propelo-CSRF': '1'};
    const r = await fetch(path, opt);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(d.error || 'Something went wrong.'), {status: r.status});
    return d;
  }
  function mark(p){
    const b = p.branding || {};
    return b.logo ? `<img src="${esc(b.logo)}?v=${Date.now()}" alt="">` : `<span class="tile" aria-hidden="true">${esc((p.name || '?').slice(0, 1).toUpperCase())}</span>`;
  }
  const money = (minor, cur) => cur === 'USD' ? '$' + (minor / 100).toLocaleString('en-US') : '₹' + Math.round(minor / 100).toLocaleString('en-IN');
  function billing(p){
    const note = {requested: 'You asked for a free pilot. A person replies within 2 working days, by email.',
      pending: 'Waiting for your payment. Your account starts as soon as it goes through.',
      paused: 'This account is paused.', ended: 'This account has ended. Nothing was deleted; pay to switch it back on.'}[p.status]
      || (!p.live ? 'This account has ended. Nothing was deleted; pay to switch it back on.' : p.status === 'pilot' ? `Free pilot until ${when(p.endsAt)}.` : `Paid until ${when(p.endsAt)}. Nothing renews by itself; we remind you a week before.`);
    const pay = p.canPay && p.price ? `<button class="btn" data-act="pay" data-pid="${esc(p.id)}">${p.status === 'pending' ? 'Pay' : 'Pay for 30 days'} · ${esc(money(p.price, p.currency))}</button>` : '';
    const hist = (p.payments || []).length ? `<p class="small muted" style="margin:8px 0 0">Payments: ${p.payments.map(x => esc(money(x.amount, x.currency)) + ' on ' + esc(when(x.paidAt))).join(', ')}</p>` : '';
    return `<section class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0 0 4px">${esc(p.planName || 'Plan')}</h2><p class="small muted" style="margin:0">${esc(note)}</p>${hist}</div>${pay}</div><div class="err" id="pay-err-${esc(p.id)}" role="alert"></div></section>`;
  }
  function status(p){ const label = p.live ? (p.status === 'pilot' ? 'Pilot' : 'Active') : ({requested: 'Pilot requested', pending: 'Awaiting payment', paused: 'Paused'}[p.status] || 'Ended'); return `<span class="pill ${p.live ? 'live' : 'off'}">${label}</span>${p.endsAt && p.live ? `<span class="small muted">until ${esc(when(p.endsAt))}</span>` : ''}`; }

  function consultancy(p){
    const t = p.totals || {};
    const rows = (p.students || []).map(s => `<tr><td><b>${esc(s.name || '')}</b><br><span class="small muted">${esc(s.email)}</span></td>
      <td class="n">${s.matched}</td><td class="n">${s.applied}</td><td class="n">${s.interviews}</td><td class="n">${s.offers}</td><td class="n">${s.sponsorRoles}</td>
      <td class="small">${esc(when(s.lastActive)) || '<span class="muted">not yet</span>'}</td>
      <td class="small">${(s.interviewRoles || []).map(r => esc(r.company + ' · ' + r.title)).join('<br>')}</td>
      <td><button class="btn sm ghost" data-act="remove" data-pid="${esc(p.id)}" data-uid="${esc(s.id)}">Remove</button></td></tr>`).join('');
    return `<section class="card"><div class="row" style="justify-content:space-between"><div class="brand">${mark(p)}<div><h1>${esc(p.name)}</h1><div class="row">${status(p)}<span class="small muted">Students get ${esc(p.studentPlan === 'ultra' ? 'Ultra' : 'Pro')}</span></div></div></div></div></section>
    ${billing(p)}
    <section class="card"><div class="stats">
      <div class="stat"><b>${p.seatsUsed} / ${p.seats}</b><span class="small muted">seats used</span></div>
      <div class="stat"><b>${t.matched || 0}</b><span class="small muted">roles matched</span></div>
      <div class="stat"><b>${t.applied || 0}</b><span class="small muted">applications</span></div>
      <div class="stat"><b>${t.interviews || 0}</b><span class="small muted">interviews</span></div>
      <div class="stat"><b>${t.offers || 0}</b><span class="small muted">offers</span></div></div></section>
    <section class="card"><h2>Invite your students</h2><p class="small muted">Share this link in your student WhatsApp group or email. Each student who joins uses one seat and gets the paid plan while your account is active. They see what you will see before they join.</p>
      <div class="copy"><input readonly value="${esc(p.inviteUrl)}" aria-label="Invite link"><button class="btn sm" data-act="copy" data-v="${esc(p.inviteUrl)}">Copy</button><button class="btn sm ghost" data-act="rotate-invite" data-pid="${esc(p.id)}">New link</button></div>
      <p class="small muted" style="margin-top:8px">A new link stops the old one from working. Students who already joined stay.</p></section>
    <section class="card"><div class="row" style="justify-content:space-between"><h2>Students</h2>${(p.students || []).length ? `<button class="btn sm ghost" data-act="export" data-pid="${esc(p.id)}">Download CSV</button>` : ''}</div>
      ${rows ? `<div class="tablewrap"><table><thead><tr><th>Student</th><th>Matched</th><th>Applied</th><th>Interviews</th><th>Offers</th><th>Sponsor roles</th><th>Last active</th><th>Interviewing at</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="small muted" style="margin-top:8px">"Sponsor roles" counts matched roles whose posting says it sponsors visas or whose employer is on the UK sponsor register. Interviews and offers are what each student recorded or their inbox showed.</p>`
      : '<p class="muted">No students yet. Share the invite link above.</p>'}</section>
    ${brandForm(p)}`;
  }

  function brandForm(p){
    const b = p.brand || {};
    return `<section class="card"><h2>Your branding</h2><p class="small muted">Students see your name and logo in their app.</p>
      <div class="grid2"><label class="f">Brand colour<input id="b-color-${esc(p.id)}" value="${esc(b.color || '')}" placeholder="#1F6F5C"></label>
      <label class="f">One-line tagline<input id="b-tag-${esc(p.id)}" value="${esc(b.tagline || '')}" maxlength="140"></label>
      <label class="f">Website<input id="b-web-${esc(p.id)}" value="${esc(b.website || '')}" placeholder="https://"></label>
      <label class="f">Contact email for students<input id="b-mail-${esc(p.id)}" value="${esc(b.contactEmail || '')}"></label>
      <label class="f">Logo (PNG, JPEG or WebP, under 200 KB)<input type="file" id="b-logo-${esc(p.id)}" accept="image/png,image/jpeg,image/webp"></label></div>
      <div class="row" style="margin-top:12px"><button class="btn" data-act="save-brand" data-pid="${esc(p.id)}">Save branding</button><span class="err" id="b-err-${esc(p.id)}" role="alert"></span></div></section>`;
  }

  function agency(p){
    const f = p.filters || {}, k = state.key[p.id];
    const opts = COUNTRIES.map(([c, n]) => `<label class="row small"><input type="checkbox" class="f-c-${esc(p.id)}" value="${c}"${(f.countries || []).includes(c) ? ' checked' : ''} style="width:auto;min-height:0"> ${esc(n)}</label>`).join('');
    return `<section class="card"><div class="brand">${mark(p)}<div><h1>${esc(p.name)}</h1><div class="row">${status(p)}</div></div></div></section>
    ${billing(p)}
    <section class="card"><h2>Your daily roles feed</h2><p class="small muted">Open roles from employers' own career pages, refreshed several times a day, filtered by the settings below. Open it in a spreadsheet, or pull it into your CRM or n8n with the key. Roles only: no personal data.</p>
      <div class="copy"><input readonly value="${esc(p.feedUrl)}" aria-label="CSV feed"><button class="btn sm" data-act="copy" data-v="${esc(p.feedUrl)}">Copy</button></div>
      <div class="copy" style="margin-top:8px"><input readonly value="${esc(p.feedJsonUrl)}" aria-label="JSON feed"><button class="btn sm" data-act="copy" data-v="${esc(p.feedJsonUrl)}">Copy</button></div>
      <p class="small muted" style="margin-top:8px">Send the key as <code>Authorization: Bearer &lt;key&gt;</code>, or add <code>?key=&lt;key&gt;</code> to the URL.</p>
      ${k ? `<div class="note"><b>Your new key. Copy it now; it is shown only once.</b><div class="key" style="margin-top:6px">${esc(k)}</div></div>` : ''}
      <div class="row" style="margin-top:10px"><button class="btn sm ghost" data-act="rotate-key" data-pid="${esc(p.id)}">${p.hasKey ? 'Make a new key (the old one stops working)' : 'Create a key'}</button></div></section>
    <section class="card"><h2>What goes in the feed</h2>
      <div class="grid2">
        <label class="f">Title keywords (any of, comma separated)<input id="f-kw-${esc(p.id)}" value="${esc((f.keywords || []).join(', '))}" placeholder="engineer, developer, data"></label>
        <label class="f">Leave out titles with<input id="f-ex-${esc(p.id)}" value="${esc((f.exclude || []).join(', '))}" placeholder="intern, principal"></label>
        <label class="f">Cities (any of)<input id="f-city-${esc(p.id)}" value="${esc((f.cities || []).join(', '))}" placeholder="london, manchester"></label>
        <label class="f">Remote roles<select id="f-rem-${esc(p.id)}"><option value="any"${f.remote === 'any' || !f.remote ? ' selected' : ''}>Include</option><option value="exclude"${f.remote === 'exclude' ? ' selected' : ''}>Leave out</option><option value="only"${f.remote === 'only' ? ' selected' : ''}>Only remote</option></select></label>
        <label class="f">Open for at least (days)<input id="f-days-${esc(p.id)}" type="number" min="0" max="365" value="${esc(f.minDaysOpen || 0)}"></label>
        <label class="f">Visa sponsorship<select id="f-sp-${esc(p.id)}"><option value="">Any</option><option value="offers"${f.sponsor === 'offers' ? ' selected' : ''}>Posting says it sponsors</option><option value="not-no"${f.sponsor === 'not-no' ? ' selected' : ''}>Leave out "cannot sponsor"</option><option value="uk-register"${f.sponsor === 'uk-register' ? ' selected' : ''}>On the UK sponsor register</option></select></label>
        <label class="f">Most rows<input id="f-lim-${esc(p.id)}" type="number" min="1" max="2000" value="${esc(f.limit || 500)}"></label>
      </div>
      <fieldset style="border:0;padding:0;margin:12px 0 0"><legend class="small muted">Countries (none ticked: all)</legend><div class="row">${opts}</div></fieldset>
      <div class="row" style="margin-top:12px"><button class="btn" data-act="save-filters" data-pid="${esc(p.id)}">Save and preview</button><span class="err" id="f-err-${esc(p.id)}" role="alert"></span></div></section>
    <section class="card"><h2>Preview</h2><div id="pv-${esc(p.id)}"><p class="muted small">Loading the first 50 rows…</p></div></section>`;
  }

  async function preview(pid){
    const box = $('#pv-' + pid); if (!box) return;
    try {
      const d = await api(`/api/partner/${encodeURIComponent(pid)}/preview`);
      box.innerHTML = d.rows.length ? `<p class="small muted">${d.rows.length} shown (the full feed has up to your row limit), longest open first.</p><div class="tablewrap"><table><thead><tr><th>Company</th><th>Role</th><th>Where</th><th>Days open</th><th>Sponsorship</th><th>UK register</th></tr></thead><tbody>${d.rows.map(r => `<tr><td>${esc(r.company)}</td><td><a href="${esc(/^https:\/\//.test(r.url) ? r.url : '#')}" target="_blank" rel="noopener">${esc(r.title)}</a></td><td class="small">${esc(r.location)}</td><td class="n">${esc(r.days_open)}</td><td class="small" title="${esc(r.sponsorship_quote)}">${esc(r.sponsorship)}</td><td class="small">${esc(r.uk_sponsor_register)}</td></tr>`).join('')}</tbody></table></div>`
        : '<p class="muted">No open roles match these filters. Widen the keywords, countries or days open.</p>';
    } catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  }

  function staffPanel(){
    if (!state.staff) return '';
    const rows = state.staff.map(p => `<tr><td><b>${esc(p.name)}</b><br><span class="small muted">${esc(p.kind)} · ${esc(p.slug)}</span></td><td>${esc(p.status)}${p.live ? '' : ' (off)'}</td>
      <td class="n">${p.kind === 'consultancy' ? `${p.seatsUsed} / ${p.seats}` : '–'}</td><td class="small">${esc(p.admins.join(', '))}</td><td class="small">${esc((p.billing || {}).amount || '')} ${esc((p.billing || {}).currency || '')}</td><td class="small">${esc(when(p.endsAt))}</td>
      <td><select data-act="staff-status" data-pid="${esc(p.id)}" aria-label="Status">${['requested', 'pending', 'pilot', 'active', 'paused', 'ended'].map(s => `<option${s === p.status ? ' selected' : ''}>${s}</option>`).join('')}</select>
      ${p.status === 'requested' ? `<button class="btn sm" data-act="approve-pilot" data-pid="${esc(p.id)}" style="margin-top:6px">Start ${p.kind === 'consultancy' ? '25-seat ' : ''}pilot</button>` : ''}</td></tr>
      ${Object.keys(p.request || {}).length ? `<tr><td colspan="7" class="small muted">${esc(p.plan)} · ${Object.entries(p.request).map(([k, v]) => esc(k) + ': ' + esc(v)).join(' · ')}</td></tr>` : ''}`).join('');
    return `<section class="card"><h2>All business accounts (staff)</h2>${rows ? `<div class="tablewrap"><table><thead><tr><th>Account</th><th>Status</th><th>Seats</th><th>Admins</th><th>Agreed</th><th>Until</th><th>Change</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="muted">None yet.</p>'}</section>
    <section class="card"><h2>Add a business account</h2><p class="small muted">The admin must already have an account (they sign up with their work email first).</p>
      <div class="grid2"><label class="f">Kind<select id="n-kind"><option value="consultancy">Consultancy (student portal)</option><option value="agency">Recruiting agency (roles feed)</option></select></label>
      <label class="f">Business name<input id="n-name"></label><label class="f">Admin email<input id="n-admin" type="email"></label>
      <label class="f">Seats (consultancy)<input id="n-seats" type="number" min="0" value="25"></label>
      <label class="f">Status<select id="n-status"><option value="pilot">Pilot</option><option value="active">Active</option></select></label>
      <label class="f">Until (date)<input id="n-ends" type="date"></label>
      <label class="f">Agreed amount<input id="n-amt" placeholder="24999"></label><label class="f">Currency<select id="n-cur"><option>INR</option><option>USD</option><option>GBP</option></select></label></div>
      <div class="row" style="margin-top:12px"><button class="btn" data-act="staff-create">Create</button><span class="err" id="n-err" role="alert"></span></div><div id="n-out"></div></section>`;
  }

  function render(){
    const parts = state.partners.map(p => p.kind === 'consultancy' ? consultancy(p) : agency(p)).join('');
    $('#m').innerHTML = (parts || (state.staff ? '' : `<section class="card"><h1>No business account here</h1><p class="muted" style="margin-top:8px">This login isn't the admin of a consultancy or agency account. If you were expecting one, write to us from the email you signed up with.</p></section>`)) + staffPanel();
    state.partners.filter(p => p.kind === 'agency').forEach(p => preview(p.id));
  }

  async function load(){
    const d = await api('/api/partner');
    state.partners = d.partners;
    let me = {}; try { me = await api('/api/me'); } catch (e) {}
    state.staff = null;
    if (me.isStaff) { try { state.staff = (await api('/api/staff/partners')).partners; } catch (e) { state.staff = null; } }
    render();
  }

  const fileData = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
  const list = v => String(v || '').split(',').map(x => x.trim()).filter(Boolean);

  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
    const pid = b.dataset.pid, act = b.dataset.act;
    try {
      if (act === 'copy'){ await navigator.clipboard.writeText(b.dataset.v); b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1500); return; }
      if (act === 'pay'){ b.disabled = true; const d = await api(`/api/partner/${pid}/pay`, 'POST', {}); if (/^https:\/\//.test(d.url)) location.href = d.url; return; }
      if (act === 'approve-pilot'){ await api(`/api/staff/partners/${pid}/approve-pilot`, 'POST'); return load(); }
      if (act === 'rotate-invite'){ if (!confirm('Make a new invite link? The old link stops working.')) return; await api(`/api/partner/${pid}/rotate-invite`, 'POST'); return load(); }
      if (act === 'rotate-key'){ if (!confirm('Make a new key? Anything using the old key stops working.')) return; state.key[pid] = (await api(`/api/partner/${pid}/rotate-key`, 'POST')).key; return load(); }
      if (act === 'remove'){ if (!confirm('Remove this student? Their seat is freed and they go back to the free plan.')) return; await api(`/api/partner/${pid}/remove/${b.dataset.uid}`, 'POST'); return load(); }
      if (act === 'export'){
        const p = state.partners.find(x => x.id === pid);
        const cols = ['name', 'email', 'joinedAt', 'matched', 'applied', 'interviews', 'offers', 'sponsorRoles', 'lastActive'];
        const cell = v => { const s = String(v == null ? '' : v); const t = /^[=+\-@]/.test(s) ? "'" + s : s; return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
        const csv = [cols.join(',')].concat(p.students.map(s => cols.map(c => cell(s[c])).join(','))).join('\n');
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'})); a.download = p.slug + '-students.csv'; a.click(); return;
      }
      if (act === 'save-brand'){
        $('#b-err-' + pid).textContent = '';
        await api(`/api/partner/${pid}`, 'PATCH', {brand: {color: $('#b-color-' + pid).value.trim(), tagline: $('#b-tag-' + pid).value.trim(), website: $('#b-web-' + pid).value.trim(), contactEmail: $('#b-mail-' + pid).value.trim()}});
        const f = $('#b-logo-' + pid).files[0];
        if (f) await api(`/api/partner/${pid}/logo`, 'POST', {dataUrl: await fileData(f)});
        return load();
      }
      if (act === 'save-filters'){
        $('#f-err-' + pid).textContent = '';
        await api(`/api/partner/${pid}`, 'PATCH', {filters: {keywords: list($('#f-kw-' + pid).value), exclude: list($('#f-ex-' + pid).value), cities: list($('#f-city-' + pid).value),
          remote: $('#f-rem-' + pid).value, minDaysOpen: Number($('#f-days-' + pid).value || 0), sponsor: $('#f-sp-' + pid).value, limit: Number($('#f-lim-' + pid).value || 500),
          countries: $$('.f-c-' + pid).filter(x => x.checked).map(x => x.value)}});
        return load();
      }
      if (act === 'staff-create'){
        $('#n-err').textContent = '';
        const ends = $('#n-ends').value;
        const d = await api('/api/staff/partners', 'POST', {kind: $('#n-kind').value, name: $('#n-name').value.trim(), adminEmail: $('#n-admin').value.trim(), seats: Number($('#n-seats').value || 0),
          status: $('#n-status').value, endsAt: ends ? ends + 'T23:59:59Z' : null, billing: {amount: $('#n-amt').value.trim(), currency: $('#n-cur').value}});
        await load();
        $('#n-out').innerHTML = `<div class="note" style="margin-top:10px">Created <b>${esc(d.partner.name)}</b>.${d.partner.inviteCode ? ` Student invite: <span class="key">${esc(location.origin + '/join/' + d.partner.inviteCode)}</span>` : ''}${d.feedKey ? ` Feed key (shown once): <span class="key">${esc(d.feedKey)}</span>` : ''}</div>`;
        return;
      }
    } catch (err) {
      const box = $('#' + (act === 'pay' ? 'pay-err-' + pid : act === 'save-brand' ? 'b-err-' + pid : act === 'save-filters' ? 'f-err-' + pid : act === 'staff-create' ? 'n-err' : 'x')) ;
      if (box) box.textContent = err.message; else alert(err.message);
      if (b) b.disabled = false;
    }
  });
  document.addEventListener('change', async e => {
    const s = e.target.closest('select[data-act="staff-status"]'); if (!s) return;
    try { await api(`/api/staff/partners/${s.dataset.pid}`, 'PATCH', {status: s.value}); await load(); } catch (err) { alert(err.message); }
  });
  load().catch(e => { $('#m').innerHTML = `<section class="card"><p>${esc(e.message)}</p></section>`; });
})();
</script>
</body>
</html>
