<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page not found · Propelo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
/* Same world as the website and the sign-in page: cream board, a pinned note, ink pill buttons. */
:root{--page:#FAF3E6;--sand:#F2EADC;--ink:#151515;--muted:#5E574E;--line-2:rgba(21,21,21,.16);--pink:#FF85BA;--yellow:#FCF15C;--btn:#151515;--btn-ink:#FAF3E6;
  --f:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--ease:cubic-bezier(.16,1,.3,1)}
@media (prefers-color-scheme:dark){:root{--page:#141311;--sand:#201E1B;--ink:#F3ECE0;--muted:#B3AB9F;--line-2:rgba(243,236,224,.18);--btn:#F3ECE0;--btn-ink:#141311}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--page);color:var(--ink);font:400 16px/1.55 var(--f);-webkit-font-smoothing:antialiased}
.top{padding:24px clamp(16px,4vw,48px)}
.brand{display:inline-flex;align-items:baseline;gap:2px;font:600 24px/1 var(--f);letter-spacing:-.05em;color:var(--ink);text-decoration:none}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--pink)}
main{flex:1;display:grid;place-items:center;padding:16px 16px 64px}
.board{width:100%;max-width:560px;background:var(--sand);border-radius:28px;padding:clamp(28px,5vw,48px);position:relative;animation:rise 480ms var(--ease) both}
.note{position:absolute;right:clamp(16px,4vw,36px);top:-22px;background:var(--pink);color:#151515;border-radius:4px 4px 16px 4px;padding:10px 16px;font:600 22px/1 var(--f);letter-spacing:-.03em;transform:rotate(3deg);box-shadow:0 14px 26px -18px rgba(21,21,21,.5)}
h1{margin:0 0 10px;font:500 clamp(30px,5vw,40px)/1.05 var(--f);letter-spacing:-.045em;max-width:14ch}
mark{color:inherit;background:linear-gradient(transparent 58%,var(--yellow) 58%,var(--yellow) 92%,transparent 92%) no-repeat}
@media (prefers-color-scheme:dark){mark{background:linear-gradient(transparent 58%,rgba(252,241,92,.34) 58%,rgba(252,241,92,.34) 92%,transparent 92%) no-repeat}}
p{margin:0 0 22px;color:var(--muted);max-width:44ch}
.row{display:flex;gap:10px;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 22px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font:500 15.5px/1 var(--f);text-decoration:none;transition:transform 150ms var(--ease)}
a.btn:active{transform:scale(.98)}
a.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
a.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.stand{position:relative;width:100%;max-width:560px;margin-top:150px}
.stand .board{z-index:1}
.peep{position:absolute;left:clamp(20px,6vw,52px);bottom:calc(100% - 18px);height:168px;width:auto;pointer-events:none;animation:rise 600ms var(--ease) 180ms both}
@media (prefers-color-scheme:dark){.peep{filter:drop-shadow(1.5px 0 0 #F3ECE0) drop-shadow(-1.5px 0 0 #F3ECE0) drop-shadow(0 1.5px 0 #F3ECE0) drop-shadow(0 -1.5px 0 #F3ECE0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){.board,.peep{animation:none}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/">propelo<i aria-hidden="true"></i></a></header>
<main>
  <div class="stand">
  <img class="peep" src="/peeps/lost" alt="" width="1177" height="1156">
  <div class="board">
    <span class="note" aria-hidden="true">404</span>
    <h1>We <mark>couldn't find that page</mark>.</h1>
    <p>The link may be old or mistyped. If you followed a link from an email, it may have expired: sign in and try again.</p>
    <div class="row"><a class="btn" href="/app">Open Propelo</a><a class="btn ghost" href="/pricing">Pricing</a><a class="btn ghost" href="/contact">Contact</a></div>
  </div>
  </div>
</main>
</body>
</html>
